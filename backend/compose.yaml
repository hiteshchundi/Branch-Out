services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: branch_out
      POSTGRES_USER: branch_out
      POSTGRES_PASSWORD: branch_out
    ports:
      - "${BRANCH_OUT_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U branch_out -d branch_out"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      # PostgreSQL 18 stores its versioned PGDATA directory under this parent.
      - branch_out_postgres_data:/var/lib/postgresql

volumes:
  branch_out_postgres_data:
