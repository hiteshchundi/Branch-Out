openapi: 3.1.0
info:
  title: Branch-Out API
  version: 0.2.0
  description: PostgreSQL-backed project discovery and GitHub authentication for Branch-Out.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check process liveness
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /readyz:
    get:
      operationId: getReadiness
      summary: Check service readiness
      responses:
        '200':
          description: The service can accept requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/openings:
    get:
      operationId: listOpenings
      summary: List project openings
      parameters:
        - name: query
          in: query
          description: Case-insensitive terms that must all match searchable opening fields.
          schema:
            type: string
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - name: compensation
          in: query
          schema:
            $ref: '#/components/schemas/Compensation'
        - name: commitment
          in: query
          schema:
            $ref: '#/components/schemas/CommitmentBand'
      responses:
        '200':
          description: Matching project openings.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Opening'
                  meta:
                    type: object
                    required: [count]
                    properties:
                      count:
                        type: integer
                        minimum: 0
        '400':
          description: A structured filter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The catalogue could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/auth/github/start:
    get:
      operationId: startGitHubAuthentication
      summary: Start GitHub OAuth authentication
      description: Creates a single-use OAuth attempt with PKCE and redirects to GitHub.
      responses:
        '303':
          description: Continue authentication at GitHub.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '500':
          description: Authentication could not be started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: GitHub OAuth credentials are not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/auth/github/callback:
    get:
      operationId: finishGitHubAuthentication
      summary: Complete GitHub OAuth authentication
      description: Validates browser-bound state and PKCE, creates a session, and redirects to the frontend.
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '303':
          description: Authentication completed, was denied, or failed; inspect the frontend auth query value.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '500':
          description: The configured frontend redirect URL is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/session:
    get:
      operationId: getCurrentSession
      summary: Get the authenticated Branch-Out user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The current authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: No valid session is present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The session could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteCurrentSession
      summary: Log out the current user
      security:
        - sessionCookie: []
      responses:
        '204':
          description: The session was deleted or no session was present.
        '500':
          description: The session could not be deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: branch_out_session
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Role:
      type: string
      enum: [Engineering, Design, Research]
    Compensation:
      type: string
      enum: [Paid, Fixed bounty, Revenue share, Portfolio]
    CommitmentBand:
      type: string
      enum: [Under 6 hrs/week, 6–8 hrs/week, 8+ hrs/week]
    Opening:
      type: object
      required:
        - id
        - title
        - summary
        - skills
        - role
        - compensation
        - commitment
        - commitmentBand
        - duration
        - timezone
        - freshness
        - stage
        - desiredOutcome
        - firstMilestone
        - ownerContribution
        - ownerName
        - ownerSignal
        - confidentiality
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        skills:
          type: array
          items:
            type: string
        role:
          $ref: '#/components/schemas/Role'
        compensation:
          $ref: '#/components/schemas/Compensation'
        commitment:
          type: string
        commitmentBand:
          $ref: '#/components/schemas/CommitmentBand'
        duration:
          type: string
        timezone:
          type: string
        freshness:
          type: string
        stage:
          type: string
        desiredOutcome:
          type: string
        firstMilestone:
          type: string
        ownerContribution:
          type: string
        ownerName:
          type: string
        ownerSignal:
          type: string
        confidentiality:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            field:
              type: string
    User:
      type: object
      required:
        - id
        - githubUserId
        - githubLogin
        - avatarUrl
        - profileUrl
      properties:
        id:
          type: integer
          format: int64
        githubUserId:
          type: integer
          format: int64
        githubLogin:
          type: string
          minLength: 1
          maxLength: 39
        displayName:
          type:
            - string
            - 'null'
          maxLength: 100
        avatarUrl:
          type: string
          format: uri
        profileUrl:
          type: string
          format: uri
