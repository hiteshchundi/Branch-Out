      properties:
        displayName:
          type: string
        primaryRole:
          type: string
        skills:
          type: array
          items:
            type: string
        githubUrl:
          type: string
          format: uri
        portfolioUrl:
          type:
            - string
            - 'null'
          format: uri
        evidenceSummary:
          type: string
    OwnerApplication:
      allOf:
        - $ref: '#/components/schemas/Application'
        - type: object
          required: [applicant]
          properties:
