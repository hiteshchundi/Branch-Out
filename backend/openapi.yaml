openapi: 3.1.0
info:
  title: Branch-Out API
  version: 0.9.0
  description: PostgreSQL-backed discovery, GitHub authentication, member profiles, owner-managed opening lifecycles, proof-led applications, private owner review, immutable decisions, applicant withdrawal, and accepted-applicant trial proposal drafts for Branch-Out.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check process liveness
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /readyz:
    get:
      operationId: getReadiness
      summary: Check service readiness
      responses:
        '200':
          description: The service can accept requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/openings:
    get:
      operationId: listOpenings
      summary: List project openings
      parameters:
        - name: query
          in: query
          description: Case-insensitive terms that must all match searchable opening fields.
          schema:
            type: string
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - name: compensation
          in: query
          schema:
            $ref: '#/components/schemas/Compensation'
        - name: commitment
          in: query
          schema:
            $ref: '#/components/schemas/CommitmentBand'
      responses:
        '200':
          description: Matching project openings.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Opening'
                  meta:
                    type: object
                    required: [count]
                    properties:
                      count:
                        type: integer
                        minimum: 0
        '400':
          description: A structured filter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The catalogue could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createOpeningDraft
      summary: Create an opening draft owned by the authenticated member
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningDraftInput'
      responses:
        '201':
          description: The private owner draft was created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ManagedOpening'
        '400':
          description: The request or an opening field is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid session is present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The authenticated member must complete a profile first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The draft could not be created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/openings/mine:
    get:
      operationId: listOwnedOpenings
      summary: List openings owned by the authenticated member
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The member's openings, including private drafts.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagedOpening'
                  meta:
                    type: object
                    required: [count]
                    properties:
                      count:
                        type: integer
                        minimum: 0
        '401':
          description: No valid session is present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The owned openings could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/openings/{id}:
    put:
      operationId: updateOpeningDraft
      summary: Replace an opening draft owned by the authenticated member
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningDraftInput'
      responses:
        '200':
          description: The private owner draft was updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ManagedOpening'
        '400':
          description: The request or an opening field is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid session is present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No editable draft with this ID belongs to the member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The authenticated member must complete a profile first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The draft could not be updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/openings/{id}/publish:
    post:
      operationId: publishOwnedOpening
      summary: Publish an opening draft owned by the authenticated member
      description: Atomically changes an owned draft to published so it becomes publicly discoverable.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The opening is published.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ManagedOpening'
        '401':
          description: No valid session is present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No owned draft is available for this transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The opening could not be published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/openings/{id}/close:
    post:
      operationId: closeOwnedOpening
      summary: Close a published opening owned by the authenticated member
      description: Atomically changes an owned published opening to closed so it leaves public discovery.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The opening is closed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ManagedOpening'
        '401':
          description: No valid session is present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No owned published opening is available for this transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The opening could not be closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/openings/{id}/application:
    get:
      operationId: getOwnApplication
      summary: Get the authenticated member's application for an opening
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The member's private or submitted application.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Application'
        '401':
          description: No valid session is present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The member has no application for this opening.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The application could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: saveOwnApplicationDraft
      summary: Create or replace the authenticated member's private application draft
      description: Requires a completed profile and a published opening owned by someone else. Submitted applications are immutable.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationInput'
      responses:
        '200':
          description: The private application draft was saved.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Application'
        '400':
          description: The request or an application field is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid session is present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: A profile is required, the opening is unavailable or owned by the applicant, or the application is already submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The application draft could not be saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/openings/{id}/trial-proposal:
    get:
      operationId: getOwnTrialProposal
      summary: Get the accepted applicant's private trial proposal
      description: Returns only the current member's draft tied to an accepted application. Opening owners and other applicants cannot read it.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The accepted applicant's private proposal draft.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TrialProposal'
        '401':
          description: No valid session is present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The current accepted applicant has no proposal for this opening.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The proposal could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: saveOwnTrialProposal
      summary: Create or replace the accepted applicant's private trial proposal
      description: Requires the current member to have the immutable accepted application for this opening. The proposal remains private and is not sent to or accepted by the owner.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrialProposalInput'
      responses:
        '200':
          description: The complete private proposal draft was saved.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TrialProposal'
        '400':
          description: The request or a proposal field is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid session is present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The current member has no accepted application for this opening.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The proposal draft could not be saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/openings/{id}/application/submit:
    post:
      operationId: submitOwnApplication
      summary: Submit the authenticated member's private application
      description: Atomically changes a private draft to submitted. Submission is irreversible in this milestone.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The application was submitted and is now immutable.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Application'
        '401':
          description: No valid session is present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The application or opening is not available for submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The application could not be submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/openings/{id}/application/withdraw:
    post:
      operationId: withdrawOwnApplication
      summary: Withdraw the authenticated member's submitted application
      description: Irreversibly changes the member's own submitted application to withdrawn before an owner decision.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The application was withdrawn and can no longer be decided.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Application'
        '401':
          description: No valid session is present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The application is missing, not submitted, already withdrawn, or already decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The application could not be withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/openings/{id}/applications:
    get:
      operationId: listSubmittedApplicationsForOwner
      summary: List submitted applications for an opening owner
      description: Verifies ownership and returns submitted, decided, or withdrawn applications. Applicant drafts are never included.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Submitted applications ordered by submission time.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OwnerApplication'
                  meta:
                    type: object
                    required: [count]
                    properties:
                      count:
                        type: integer
                        minimum: 0
        '401':
          description: No valid session is present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The opening does not exist or is not owned by the current member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Submitted applications could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/openings/{id}/applications/{applicationId}/decision:
    post:
      operationId: decideSubmittedApplication
      summary: Accept or decline a submitted application
      description: Requires opening ownership and a submitted application. The first accepted or declined decision is immutable.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationDecisionInput'
      responses:
        '200':
          description: The immutable owner decision was recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Application'
        '400':
          description: The decision request is malformed or unsupported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid session is present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The opening does not exist or is not owned by the current member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The application is missing, not submitted, or already decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The decision could not be recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/auth/github/start:
    get:
      operationId: startGitHubAuthentication
      summary: Start GitHub OAuth authentication
      description: Creates a single-use OAuth attempt with PKCE and redirects to GitHub.
      responses:
        '303':
          description: Continue authentication at GitHub.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '500':
          description: Authentication could not be started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: GitHub OAuth credentials are not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/auth/github/callback:
    get:
      operationId: finishGitHubAuthentication
      summary: Complete GitHub OAuth authentication
      description: Validates browser-bound state and PKCE, creates a session, and redirects to the frontend.
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '303':
          description: Authentication completed, was denied, or failed; inspect the frontend auth query value.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '500':
          description: The configured frontend redirect URL is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/session:
    get:
      operationId: getCurrentSession
      summary: Get the authenticated Branch-Out user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The current authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: No valid session is present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The session could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteCurrentSession
      summary: Log out the current user
      security:
        - sessionCookie: []
      responses:
        '204':
          description: The session was deleted or no session was present.
        '500':
          description: The session could not be deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/profile:
    get:
      operationId: getCurrentProfile
      summary: Get the authenticated member's collaboration profile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The current member's profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Profile'
        '401':
          description: No valid session is present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The authenticated member has not completed a profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The profile could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: putCurrentProfile
      summary: Create or replace the authenticated member's collaboration profile
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: The saved profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Profile'
        '400':
          description: The request or a profile field is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: No valid session is present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The profile could not be saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: branch_out_session
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Role:
      type: string
      enum: [Engineering, Design, Research]
    Compensation:
      type: string
      enum: [Paid, Fixed bounty, Revenue share, Portfolio]
    CommitmentBand:
      type: string
      enum: [Under 6 hrs/week, 6–8 hrs/week, 8+ hrs/week]
    Opening:
      type: object
      required:
        - id
        - title
        - summary
        - skills
        - role
        - compensation
        - commitment
        - commitmentBand
        - duration
        - timezone
        - freshness
        - stage
        - desiredOutcome
        - firstMilestone
        - ownerContribution
        - ownerName
        - ownerSignal
        - confidentiality
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        skills:
          type: array
          items:
            type: string
        role:
          $ref: '#/components/schemas/Role'
        compensation:
          $ref: '#/components/schemas/Compensation'
        commitment:
          type: string
        commitmentBand:
          $ref: '#/components/schemas/CommitmentBand'
        duration:
          type: string
        timezone:
          type: string
        freshness:
          type: string
        stage:
          type: string
        desiredOutcome:
          type: string
        firstMilestone:
          type: string
        ownerContribution:
          type: string
        ownerName:
          type: string
        ownerSignal:
          type: string
        confidentiality:
          type: string
    ManagedOpening:
      allOf:
        - $ref: '#/components/schemas/Opening'
        - type: object
          required: [publicationStatus]
          properties:
            publicationStatus:
              type: string
              enum: [draft, published, closed]
    OpeningDraftInput:
      type: object
      additionalProperties: false
      required:
        - projectName
        - problem
        - role
        - skills
        - commitment
        - duration
        - timezone
        - compensation
        - firstMilestone
        - ownerContribution
        - confidentiality
      properties:
        projectName:
          type: string
          minLength: 3
          maxLength: 80
        problem:
          type: string
          minLength: 20
          maxLength: 240
        role:
          type: string
          enum: [Frontend engineer, Backend engineer, Product designer, UX researcher]
        skills:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 40
        commitment:
          type: string
          enum: [Under 6 hrs/week, 6–8 hrs/week, 8+ hrs/week]
        duration:
          type: string
          enum: [2–4 weeks, 5–8 weeks, 2–3 months]
        timezone:
          type: string
          minLength: 3
          maxLength: 80
        compensation:
          type: string
          enum: [Paid, Fixed bounty, Revenue share, Unpaid / portfolio]
        firstMilestone:
          type: string
          minLength: 20
          maxLength: 500
        ownerContribution:
          type: string
          minLength: 20
          maxLength: 500
        confidentiality:
          type: string
          enum: [Public, Limited details, Confidential after agreement]
    ApplicationInput:
      type: object
      additionalProperties: false
      required:
        - message
        - workSampleUrl
        - workSampleContext
        - availability
        - availabilityConfirmed
        - proposedContribution
      properties:
        message:
          type: string
          minLength: 30
          maxLength: 1000
        workSampleUrl:
          type: string
          format: uri
          maxLength: 2048
        workSampleContext:
          type: string
          minLength: 20
          maxLength: 500
        availability:
          type: string
          minLength: 3
          maxLength: 160
        availabilityConfirmed:
          type: boolean
          const: true
        proposedContribution:
          type: string
          minLength: 20
          maxLength: 500
    ApplicationDecisionInput:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [accepted, declined]
    TrialProposalInput:
      type: object
      additionalProperties: false
      required:
        - outcome
        - deliverable
        - nonGoals
        - startDate
        - endDate
        - weeklyHours
        - checkInCadence
        - accessLevel
        - confidentiality
        - ipOwnership
        - exitPlan
        - termsConfirmed
      properties:
        outcome:
          type: string
          minLength: 20
          maxLength: 500
        deliverable:
          type: string
          minLength: 20
          maxLength: 500
        nonGoals:
          type: string
          minLength: 15
          maxLength: 500
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Must be 13 to 15 calendar days after startDate.
        weeklyHours:
          type: integer
          minimum: 1
          maximum: 40
        checkInCadence:
          type: string
          enum: [Async update every two days, Twice-weekly live check-in, Weekly review plus async updates]
        accessLevel:
          type: string
          enum: [Sandbox or sample data only, Limited repository access, Time-limited production access]
        confidentiality:
          type: string
          enum: [Public work only, Private after written agreement, Synthetic data during trial]
        ipOwnership:
          type: string
          enum:
            - Contributor retains pre-existing work; project owns trial deliverable
            - Contributor licenses trial deliverable to the project
            - Open-source contribution under the project license
            - Custom written terms required before work starts
        exitPlan:
          type: string
          minLength: 20
          maxLength: 500
        termsConfirmed:
          type: boolean
          const: true
    TrialProposal:
      type: object
      required: [id, applicationId, openingId, input, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        openingId:
          type: string
        input:
          $ref: '#/components/schemas/TrialProposalInput'
        status:
          type: string
          const: draft
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Application:
      type: object
      required: [id, openingId, input, status, submittedAt, decidedAt, withdrawnAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        openingId:
          type: string
        input:
          $ref: '#/components/schemas/ApplicationInput'
        status:
          type: string
          enum: [draft, submitted, accepted, declined, withdrawn]
        submittedAt:
          type:
            - string
            - 'null'
          format: date-time
        decidedAt:
          type:
            - string
            - 'null'
          format: date-time
        withdrawnAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApplicantProof:
      type: object
